<title>Wound Warriors</title>

<style>
/* Layout: one arcade screen, centered and scaled to fit the viewport. Single deliberate dark arcade look. */
:root{--bg:#120e22;--frame:#3d3166;--fg:#f4f0ff;--accent:#ff5d8f;--ink:#0d0a1a;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);margin:0;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:4px;background:#1a1430;touch-action:none;outline:none;max-width:100%}
canvas:focus-visible{border-color:var(--accent)}
#wrap:fullscreen{background:var(--bg)}#wrap:-webkit-full-screen{background:var(--bg)}
</style>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Wound Warriors game. Use mouse, touch, or arrow keys."></canvas></div>
<script>
(()=>{
'use strict';
const W=360,H=540,DPR=Math.min(3,Math.max(2,window.devicePixelRatio||1));
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
let VW=W,VH=H,OX=0,OY=0,RESERVE=0;
function fit(){wrap.style.paddingBottom=RESERVE+'px';const aw=Math.max(1,wrap.clientWidth),ah=Math.max(1,wrap.clientHeight-RESERVE),r=aw/ah;let nw=W,nh=H;
 if(r>=W/H)nw=Math.min(900,Math.round(H*r));else nh=Math.min(860,Math.round(W/r));
 if(nw!==VW||nh!==VH||cv.width!==nw*DPR){VW=nw;VH=nh;OX=Math.floor((VW-W)/2);OY=Math.floor((VH-H)/2);cv.width=VW*DPR;cv.height=VH*DPR;}
 const s=Math.min(aw/VW,ah/VH);cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';}
addEventListener('resize',fit);fit();
/* Signed-out viewers get Claude's sign-in bar along the bottom; keep the game above it. */
(async()=>{try{if(!window.claude||typeof window.claude.use!=='function')return;const u=await window.claude.use('user');if(!u){RESERVE=innerWidth<700?108:80;fit();}}catch(e){}})();

const PX='"Press Start 2P", monospace',VT='"VT323", monospace',EMO='sans-serif';
const C={ink:'#0d0a1a',plum:'#1a1430',plum2:'#2a2147',plum3:'#3d3166',white:'#f4f0ff',pink:'#ff5d8f',pink2:'#ffb3c9',gold:'#ffcc33',teal:'#3ddbb4',blue:'#4cc9f0',red:'#ff4d5e',gray:'#9a93b8',floor:'#dfe8ef',floor2:'#cbd8e2'};
const CONF=['#ff5d8f','#ffcc33','#3ddbb4','#4cc9f0','#b388ff','#ffffff'];
const PXCM=26,CX=180,CY=280,RATE=1.3;

const rand=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)],lerp=(a,b,t)=>a+(b-a)*clamp(t,0,1);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=v=>clamp(Math.round(p<0?v*(1+p):v+(255-v)*p),0,255);return '#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1);}

/* ---------- drawing helpers ---------- */
function txt(s,x,y,size=8,col=C.white,align='center',font=PX){ctx.font=size+'px '+font;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y);}
function txtS(s,x,y,size=8,col=C.white,align='center',font=PX){txt(s,x+1,y+1,size,C.ink,align,font);txt(s,x,y,size,col,align,font);}
function wrapTxt(s,x,y,maxW,size,col,lh,font=VT,align='left'){ctx.font=size+'px '+font;let line='',yy=y;for(const w of s.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){txt(line,x,yy,size,col,align,font);line=w;yy+=lh;}else line=t;}if(line)txt(line,x,yy,size,col,align,font);return yy+lh;}
function fitTxt(s,x,y,maxW,size,col,align='center',font=VT){let sz=size;ctx.font=sz+'px '+font;while(sz>9&&ctx.measureText(s).width>maxW){sz--;ctx.font=sz+'px '+font;}txt(s,x,y,sz,col,align,font);}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function box(x,y,w,h,fill,border=C.ink,hi){rect(x-2,y-2,w+4,h+4,border);rect(x,y,w,h,fill);if(hi)rect(x,y,w,2,hi);}
function line(a,b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
function emo(s,x,y,size){ctx.font=size+'px '+EMO;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function meter(x,y,w,h,frac,col,label){box(x,y,w,h,'#2a1d3a');rect(x,y,w*clamp(frac,0,1),h,col);rect(x,y,w*clamp(frac,0,1),2,'rgba(255,255,255,.35)');if(label)txtS(label,x+w/2,y+h/2+1,6,C.white);}
function btn(label,x,y,w,h,onTap,o={}){return{label,x,y,w,h,onTap,col:o.col||C.pink,tc:o.tc||C.white,size:o.size||8,sub:o.sub,disabled:false,hidden:false};}
const hit=(b,p)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
let pressed=null;
function drawBtn(b){if(b.hidden)return;const oy=b===pressed?3:0;rect(b.x-2,b.y,b.w+4,b.h+5,C.ink);box(b.x,b.y+oy,b.w,b.h,b.disabled?C.plum3:b.col,C.ink,'rgba(255,255,255,.4)');const tc=b.disabled?C.gray:b.tc;txt(b.label,b.x+b.w/2,b.y+oy+b.h/2+(b.sub?-6:1),b.size,tc);if(b.sub)txt(b.sub,b.x+b.w/2,b.y+oy+b.h/2+9,16,tc,'center',VT);}

/* ---------- audio ---------- */
let AC=null,master=null,musicBus=null,sfxBus=null,drumBus=null,NOISE=null,muted=false,unlocked=false;const VOL=.85;
try{muted=localStorage.getItem('ww-muted')==='1';}catch(e){}
const SILENT=(()=>{const n=1600,buf=new Uint8Array(44+n),dv=new DataView(buf.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)buf[o+i]=s.charCodeAt(i);};w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);buf.fill(128,44);let s='';for(const b of buf)s+=String.fromCharCode(b);return 'data:audio/wav;base64,'+btoa(s);})();
function initAudio(){
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:VOL;master.connect(AC.destination);
  sfxBus=AC.createGain();sfxBus.gain.value=.4;sfxBus.connect(master);drumBus=AC.createGain();drumBus.gain.value=.55;drumBus.connect(master);
  NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const nd=NOISE.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  musicBus=AC.createGain();musicBus.gain.value=.75;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;musicBus.connect(lp);lp.connect(master);
  const dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.38;fb.gain.value=.3;wet.gain.value=.28;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
 }catch(e){AC=null;}}
 if(AC&&AC.state!=='running'){try{AC.resume();}catch(e){}}
 if(!unlocked){unlocked=true;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  try{const a=new Audio(SILENT);a.loop=true;a.setAttribute('playsinline','');const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
  if(AC){try{const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);}catch(e){}}}
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:VOL;try{localStorage.setItem('ww-muted',muted?'1':'0');}catch(e){}}
function note(f,dur,type,vol,when,bus,att=.01){if(!AC)return;const t=AC.currentTime+Math.max(0,when);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(att+.05,dur));o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.1);}
function tone(f,dur,type='square',vol=.5,when=0,slide=0){if(!AC)return;const t=AC.currentTime+Math.max(0,when);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+dur+.02);}
const mf=m=>440*Math.pow(2,(m-69)/12);
const SFX={
 blip(){tone(880,.06,'square',.3)},
 good(){tone(660,.08,'square',.35);tone(990,.14,'square',.35,.08)},
 coin(){tone(988,.07,'square',.35);tone(1319,.2,'square',.35,.07)},
 bad(){tone(150,.25,'sawtooth',.45,0,-70)},
 pluck(){tone(520,.06,'triangle',.5,0,500)},
 scrub(){tone(rand(220,340),.035,'triangle',.18)},
 hit(){tone(240,.08,'square',.4,0,-140)},
 shot(){tone(1300,.05,'square',.15,0,-700)},
 sigh(){tone(420,.7,'triangle',.45,0,-280)},
 boom(){for(let i=0;i<6;i++)tone(rand(60,180),.45,'sawtooth',.4,i*.08,-40)},
 alarm(){for(let i=0;i<4;i++){tone(880,.12,'square',.35,i*.26);tone(660,.12,'square',.35,i*.26+.13);}},
 sword(){tone(1900,.12,'triangle',.4,0,-1000);tone(2600,.08,'sine',.2,.03)},
 fanfare(){[72,76,79,84,79,84].forEach((m,i)=>tone(mf(m),i===5?.7:.15,'square',.35,i*.15))}
};
/* Hip hop drum kit (synthesized): kick, clap, hats, 808 */
function kick(w,v=.9){const t=AC.currentTime+Math.max(0,w),o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(drumBus);o.start(t);o.stop(t+.35);}
function noiseHit(w,dur,v,type,freq,q=1){if(!NOISE)return;const t=AC.currentTime+Math.max(0,w),src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=NOISE;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(f);f.connect(g);g.connect(drumBus);src.start(t,Math.random()*.5);src.stop(t+dur+.02);}
function clap(w){for(let i=0;i<3;i++)noiseHit(w+i*.011,.03,.45,'bandpass',1500,.9);noiseHit(w+.033,.2,.5,'bandpass',1300,.7);}
function hat(w,v=.16,open=false){noiseHit(w,open?.22:.035,v,'highpass',open?7000:8500);}
function bass808(f,w,dur,v=.55){const t=AC.currentTime+Math.max(0,w);for(const[m,type,vv]of[[1,'sine',v],[2,'triangle',v*.22]]){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f*m*1.06,t);o.frequency.exponentialRampToValueAtTime(f*m,t+.06);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vv,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(drumBus);o.start(t);o.stop(t+dur+.05);}}

/* Soft chord-based music: warm pad + gentle arpeggio + sparse melody, through a lowpass and echo. */
const SONGS={
 shift:{bpm:70,wave:'sine',chords:[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]],arp:[0,1,2,3,2,1,2,1],pad:.07,arpVol:.2,bassVol:.2,
  mel:[76,0,0,74,72,0,0,0,72,0,0,71,69,0,0,0,69,0,72,0,77,0,0,76,74,0,0,0,0,0,0,0],melVol:.13},
 chart:{bpm:78,wave:'triangle',chords:[[57,60,64],[53,57,60],[50,53,57,60],[52,56,59]],arp:[0,2,1,2,0,2,1,2],pad:.06,arpVol:.16,bassVol:.2,mel:null},
 boss:{bpm:120,wave:'triangle',chords:[[57,60,64],[53,57,60],[55,59,62],[52,56,59]],arp:[0,1,2,1,0,1,2,1],pad:.05,arpVol:.2,bassVol:.24,bassEighths:true,
  mel:[69,0,72,0,76,0,74,72,72,0,0,0,69,0,0,0,71,0,74,0,79,0,77,76,76,0,0,0,0,0,0,0],melVol:.12},
 hiphop:{beat:true,bpm:140,roots:[45,41,48,43],chords:[[57,60,64,67],[53,57,60,64],[52,55,60,64],[55,59,62,67]],kick:[[0,10],[0,7,10],[0,10],[0,3,7,10]],roll:[0,1,0,1],
  bell:[76,0,0,72,0,0,74,0,72,0,69,0,0,0,0,0,76,0,0,72,0,0,79,0,76,0,74,0,72,0,0,0]},
 bossbeat:{beat:true,bpm:150,roots:[45,46,45,44],chords:[[57,60,64],[58,62,65],[57,60,64],[56,59,64]],kick:[[0,6,10],[0,3,10,13],[0,6,10],[0,3,7,10,14]],roll:[1,0,1,1],
  bell:[81,0,80,0,81,0,76,0,0,0,77,0,76,0,72,0,81,0,80,0,81,0,84,0,0,0,83,0,81,0,0,0]},
 throne:{bpm:84,wave:'sine',chords:[[60,64,67],[65,69,72],[67,71,74],[60,64,67,72]],arp:[0,1,2,1,0,1,2,3],pad:.08,arpVol:.18,bassVol:.2,
  mel:[72,0,76,0,79,0,0,0,77,0,76,0,74,0,0,0,74,0,77,0,79,0,0,0,76,0,0,0,72,0,0,0],melVol:.14}
};
const Music={name:null,song:null,step:0,next:0,
 play(n){if(this.name===n)return;this.name=n;this.song=SONGS[n];this.step=0;this.next=AC?AC.currentTime+.08:0;},
 stop(){this.name=null;this.song=null;},
 tickBeat(){const s=this.song,dt=60/s.bpm/4;if(this.next<AC.currentTime-.3)this.next=AC.currentTime+.05;
  while(this.next<AC.currentTime+.2){const i=this.step,w=this.next-AC.currentTime,bar=Math.floor(i/16),b=i%16,ci=bar%4,root=s.roots[ci];
   if(s.kick[ci].includes(b)){kick(w);const nk=s.kick[ci].find(x=>x>b);bass808(mf(root-12),w,dt*((nk||16)-b)*.95);}
   if(b===8)clap(w);if(b===4&&bar%2&&s.bpm>145)clap(w);
   if(s.roll[ci]&&b>=12){if(b===14){for(let k=0;k<3;k++)hat(w+k*dt/3,.12);}else hat(w,.13);}else if(b%2===0)hat(w,b%4===0?.17:.11);
   if(b===6&&bar%2)hat(w,.1,true);
   if(b===0)for(const m of s.chords[ci])note(mf(m),dt*15,'triangle',.035,w,musicBus,.02);
   const bm=s.bell[i%s.bell.length];if(bm)note(mf(bm),dt*3,'sine',.11,w,musicBus,.01);
   this.step++;this.next+=dt;}},
 tick(){if(!AC||!this.song||AC.state!=='running')return;if(this.song.beat)return this.tickBeat();const s=this.song,dt=60/s.bpm/2;if(this.next<AC.currentTime-.3)this.next=AC.currentTime+.05;
  while(this.next<AC.currentTime+.2){const i=this.step,w=this.next-AC.currentTime,ch=s.chords[Math.floor(i/8)%s.chords.length],b=i%8;
   if(b===0){for(const m of ch)note(mf(m),dt*8.6,'triangle',s.pad,w,musicBus,.6);note(mf(ch[0]-12),dt*4,'sine',s.bassVol,w,musicBus,.04);}
   else if(s.bassEighths)note(mf(ch[0]-12),dt*.9,'triangle',s.bassVol*.6,w,musicBus,.01);
   else if(b===4)note(mf(ch[0]-12),dt*4,'sine',s.bassVol*.8,w,musicBus,.04);
   note(mf(ch[s.arp[b]%ch.length]+12),dt*1.9,s.wave,s.arpVol,w,musicBus,.015);
   if(s.mel){const m=s.mel[i%s.mel.length];if(m)note(mf(m),dt*3.4,'sine',s.melVol,w,musicBus,.05);}
   this.step++;this.next+=dt;}}
};
setInterval(()=>Music.tick(),60);

/* ---------- roster & data ---------- */
const ROSTER=[['Ashley','F'],['Austin','M'],['Bobby','M'],['Christopher','F'],['Dustin','M'],['Julia','F'],['Kelly','F'],['Keri','F'],['Kinzy','F'],['Kylie','F'],['Lucas','M'],['Nathan','M'],['Noi','F'],['Paweena','F'],['Rachel','F']];

 Julia:['#f6d2b4','#a8804a','long'],Kelly:['#f1c7a1','#6b4423','bun'],Keri:['#f3cfae','#4a2e1a','curly'],Kinzy:['#f8dcc2','#7a4f2c','bob'],Kylie:['#eebf98','#6b4423','pony'],

const PATIENTS=[
 {name:'Mr. Delgado',loc:'Left heel',kind:'Pressure injury',drain:'Light',note:'Light drainage, shallow wound',dressing:'hydrocolloid',L:3.2,W:2.4,slough:3},
