<title>Wound Warriors</title>
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0}body{font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>

<title>Wound Warriors</title>

<style>
/* Layout: one arcade screen, centered and scaled to fit the viewport. Single deliberate dark arcade look. */
:root{--bg:#08121f;--frame:#1e3d6b;--fg:#f2f8ff;--accent:#8fc15a;--ink:#071322;color-scheme:dark}
html,body{height:100%;overscroll-behavior:none}
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--fg);margin:0;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:4px;background:#0c1b30;touch-action:none;outline:none;max-width:100%}
canvas:focus-visible{border-color:var(--accent)}
#wrap:fullscreen{background:var(--bg)}#wrap:-webkit-full-screen{background:var(--bg)}
</style>

const PXCM=26,CX=180,CY=280,RATE=1.6;

const rand=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)],lerp=(a,b,t)=>a+(b-a)*clamp(t,0,1);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=v=>clamp(Math.round(p<0?v*(1+p):v+(255-v)*p),0,255);return '#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1);}

/* ---------- drawing helpers ---------- */
function txt(s,x,y,size=8,col=C.white,align='center',font=PX){ctx.font=fnt(size,font);ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y);}
function txtS(s,x,y,size=8,col=C.white,align='center',font=PX){txt(s,x+1,y+1,size,C.ink,align,font);txt(s,x,y,size,col,align,font);}
function wrapTxt(s,x,y,maxW,size,col,lh,font=VT,align='left'){ctx.font=fnt(size,font);let line='',yy=y;for(const w of s.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){txt(line,x,yy,size,col,align,font);line=w;yy+=lh;}else line=t;}if(line)txt(line,x,yy,size,col,align,font);return yy+lh;}
function fitTxt(s,x,y,maxW,size,col,align='center',font=VT){let sz=size;ctx.font=fnt(sz,font);while(sz>5&&ctx.measureText(s).width>maxW){sz--;ctx.font=fnt(sz,font);}txt(s,x,y,sz,col,align,font);}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function box(x,y,w,h,fill,border=C.ink,hi){if(w<16||h<16){rect(x-2,y-2,w+4,h+4,border);rect(x,y,w,h,fill);if(hi)rect(x,y,w,2,hi);return;}
 rr(x-2,y-2,w+4,h+4,8);ctx.fillStyle=border;ctx.fill();rr(x,y,w,h,6);ctx.fillStyle=fill;ctx.fill();if(hi){ctx.save();rr(x,y,w,h,6);ctx.clip();rect(x,y,w,2,hi);ctx.restore();}}
function brandGrad(x0,x1){const g=ctx.createLinearGradient(x0,0,x1,0);BRAND.forEach((c,i)=>g.addColorStop(i/(BRAND.length-1),c));return g;}

const Lose={enter(){Music.stop();SFX.sigh();const B=Boss.B||{hp:1,max:1};this.left=B.hp;this.pct=Math.round(100*(1-B.hp/B.max));showRankUp();this.buttons=[btn('RETRY BOSS',22,474,150,48,()=>{go(Boss);startCut({title:'ROUND 2',sub:'Rematch! FIGHT!',col:C.red,dur:1.2});},{col:C.red}),btn('NEW SHIFT',188,474,150,48,()=>go(Select),{col:C.blue})];this.buttons[0].focus=true;},
 draw(){const t=this.t;rect(0,0,W,H,'#08121f');txtS('OVERTIME!',180,40,22,C.red);drawBossBody({hp:1,max:1,flash:0},40+Math.sin(t*12)*3,t,180);txtS('HA HA HA',180+Math.sin(t*9)*6,300,10,C.gold);

/* ---------- where to look next (hints) ---------- */

Dress.hint=function(){return this.done||this.drag?null:{mode:'drag',x:215,y:484,x2:CX,y2:CY,text:'Drag a dressing onto the wound'};};

BossIntro.hint=function(){return this.f.hidden?null:{mode:'tap',x:180,y:500,text:'Let’s go!'};};

 if(B.spin>0)return{mode:'tap',x:B.px,y:476,text:'Tap fast to break free!',now:true};if(this.t<7)return{mode:'drag',x:clamp(B.px-60,30,330),y:486,x2:clamp(B.px+60,30,330),y2:486,text:'Drag to dodge',now:true};return null;};

/* ---------- wide-screen side panels ---------- */
for(const s of[Ward,Assess,Cleanse,Debride,Dress,After,Chart])s.side='game';
Boss.side='boss';Select.side='select';Title.side='party';Ceremony.side='party';
let gT=0;

function sideNurse(cx,top,s,look,stressy){const by=top-2*s-26;drawPerson(cx-6*s,top,s,look,stressy?{}:{dance:gT,seed:5});if(!stressy)txt(moveName(gT,5),cx,top+18*s+60,6,C.gold);if(stressy)stressEmote(cx,by,gT);else loveEmote(cx,by,gT);}
function drawSides(){if(OX<=0&&OY<=0)return;rect(0,0,VW,VH,'#08121f');
 for(let i=0;i<60;i++){const x=(i*97+13)%VW,y=((i*151)+gT*(10+(i%4)*6))%(VH+20)-10;if(x>OX-12&&x<OX+W+12&&y>OY-12&&y<OY+H+12)continue;ctx.globalAlpha=(scene.side==='game'||scene.side==='boss')?.07:.16;if(i%3===0)emo('💗',x,y,10);else{rect(x,y-1,8,3,C.pink2);rect(x+2.5,y-3.5,3,8,C.pink2);}}ctx.globalAlpha=1;
 if(OX>0){rect(OX-5,OY,5,H,C.plum3);rect(OX+W,OY,5,H,C.plum3);}if(OY>0){rect(OX-5,OY-5,W+10,5,C.plum3);rect(OX-5,OY+H,W+10,5,C.plum3);}
 if(OY>=44)drawBands();
 ctx.save();ctx.translate(0,OY);drawPanels();ctx.restore();}
function drawBands(){const m=scene.side,top=OY/2,bot=OY+H+OY/2;
 if(m==='game'||m==='boss'){const n=N();for(let i=0;i<n;i++){const p=G.patients[i],x=OX+W/2+(i-(n-1)/2)*84,st=i<G.treated?'done':i===G.pi?'now':'wait';if(st==='now')box(x-38,top-16,76,32,C.plum3,C.gold);emo(st==='done'?(p.charted?'✅':'💗'):st==='now'?'🩹':'🛏️',x-24,top,14);txt(p.name.replace(/^(Mr|Ms|Mrs)\. /,''),x-12,top,15,st==='wait'?C.gray:C.white,'left',VT);}}
 else txtS('WOUND WARRIORS',OX+W/2,top,9,C.pink);
 if(m==='game'||m==='boss')return;const k=Math.max(1,Math.min(8,Math.floor(VW/44))),s=Math.min(2,Math.floor((OY-12)/18)||1);for(let i=0;i<k;i++){const c=ALL[(i*4+Math.floor(gT/5))%ALL.length],x=(i+.5)*VW/k;drawPerson(x-6*s,bot-9*s,s,c,{dance:gT+i*.4,seed:i});}}
function drawPanels(){
 const m=scene.side,Lx=OX/2,Rx=OX+W+OX/2,pw=Math.min(OX-28,236);if(OX<120||!m)return;
 const s=Math.max(3,Math.min(7,Math.floor((pw-24)/12)));
 if(m==='party'){for(let k=0;k<6;k++){const cx=k<3?Lx:Rx,y=110+(k%3)*140,c=ALL[(k*5+Math.floor(gT/4))%ALL.length],ss=Math.min(s,4);drawPerson(cx-6*ss,y,ss,c,{dance:gT+k*.3,seed:k*3});txt(moveName(gT+k*.3,k*3),cx,y+18*ss+28,5,C.gold);txt(c.name.toUpperCase(),cx,y+18*ss+14,6,C.pink2);}return;}
 if(OX<160)return;
 if(m==='select'){panel(Lx-pw/2,60,pw,390);const c=Select.hover||Select.sel;txt(Select.hover&&Select.hover!==Select.sel?'PREVIEW':Select.sel?'READY TO FIGHT!':'CHOOSE YOUR FIGHTER!',Lx,82,7,C.gold);
  if(!c){wrapTxt('Hover over a fighter to preview them here',Lx,190,pw-30,20,C.pink2,20,VT,'center');emo('👉',Lx,250+Math.sin(gT*4)*4,30);}else{sideNurse(Lx,150,s,c,false);txt(c.name.toUpperCase(),Lx,150+18*s+18,8,C.white);const po=powerOf(c);fitTxt('⚡ '+po.name,Lx,150+18*s+82,pw-20,18,C.gold);wrapTxt(po.d,Lx,150+18*s+100,pw-24,16,C.pink2,16,VT,'center');}
  panel(Rx-pw/2,60,pw,330);txt('HOW TO PLAY',Rx,82,7,C.gold);
  ['💗 Heal 3 patients: measure, cleanse, debride, dress','📄 Chart your notes (yes, really)','👾 Beat MEGA-CHART 3000 at 5 PM','👑 Get knighted by King Brook & Queen Tisha'].forEach((l,i)=>wrapTxt(l,Rx-pw/2+14,116+i*66,pw-28,19,C.white,18,VT,'left'));return;}
 const stressy=scene===Chart||m==='boss';
 panel(Lx-pw/2,60,pw,350);txt('YOUR FIGHTER',Lx,82,7,C.gold);sideNurse(Lx,150,s,G.char,stressy);txt(G.char.name.toUpperCase(),Lx,150+18*s+18,8,C.white);txt(stressy?'Charting... again 😤':'Happy to heal 💗',Lx,150+18*s+42,20,stressy?C.pink2:C.teal,'center',VT);{const po=powerOf(G.char);txt('⚡ '+po.name,Lx,150+18*s+80,17,G.powerReady?C.gold:C.gray,'center',VT);txt(G.powerReady?'READY · tap your nurse':'used · recharges next patient',Lx,150+18*s+97,15,C.gray,'center',VT);}
 panel(Rx-pw/2,60,pw,330);
 if(m==='boss'){const B=Boss.B;txt('INCOMING ATTACKS',Rx,82,7,C.gold);
  [['📨','Pop-Up Storm','Dodge the falling boxes',B.storm>0],['🔒','Password Expired','Tap the letters in order',!!B.pw],['🌀','Spinning Wheel','You freeze. Wait it out',B.spin>0],['✒️','Missing Signature','It chases you. Keep moving',!!B.sig]].forEach(([e,n,d,on],i)=>{const y=112+i*58;if(on)box(Rx-pw/2+8,y-14,pw-16,50,C.plum3,C.gold);emo(e,Rx-pw/2+24,y+6,18);txt(n,Rx-pw/2+42,y,19,on?C.gold:C.white,'left',VT);txt(d,Rx-pw/2+42,y+18,16,C.gray,'left',VT);});
  wrapTxt('Each signed chart = 8 ammo. Stress maxed = lose 5 sec.',Rx,358,pw-24,17,C.pink2,17,VT,'center');return;}
 txt('SHIFT BOARD',Rx,82,7,C.gold);
 G.patients.forEach((p,i)=>{const y=108+i*40,st=i<G.treated?'done':i===G.pi?'now':'wait',x0=Rx-pw/2+12;if(st==='now')box(x0-4,y-12,pw-16,36,C.plum3,C.gold);
  txt(p.name,x0+2,y,19,st==='wait'?C.gray:C.white,'left',VT);txt(p.loc,x0+2,y+15,15,C.gray,'left',VT);
  emo(st==='done'?'💗':st==='now'?'🩹':'🛏️',Rx+pw/2-40,y+6,14);if(st==='done')emo(p.charted?'✅':'📄',Rx+pw/2-20,y+6,14);});
 txt('Charts signed: '+G.charts+'/'+N(),Rx,320,18,C.teal,'center',VT);txt('Best combo x'+G.bestCombo+' · Perfect '+G.perfect,Rx,340,17,C.pink2,'center',VT);
 txt('M = mute',Rx,372,15,C.gray,'center',VT);}

/* ---------- loop & input ---------- */
const keys={};
addEventListener('keydown',e=>{keys[e.key]=true;G.idle=0;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='m'||e.key==='M'){toggleMute();return;}if(G.cut){if(G.cut.t>.5){G.cut=null;if(G.cutQ.length)startCut(G.cutQ.shift());}return;}if((e.key==='p'||e.key==='P'||(e.key===' '&&scene===Boss))&&!(scene===Boss&&Boss.B&&Boss.B.pw)){initAudio();usePower();return;}if((e.key==='f'||e.key==='F')&&!(scene===Boss&&Boss.B&&Boss.B.pw)){toggleFs();return;}initAudio();if(scene.key)scene.key(e.key);});
addEventListener('keyup',e=>{keys[e.key]=false;});
const ptr={x:-99,y:-99,down:false};
function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*VW-OX,y:(e.clientY-r.top)/r.height*VH-OY,mouse:e.pointerType==='mouse'};}
/* Keep fast scrubbing/swiping from being read by iPad Safari as page gestures (which can exit full screen). */
['touchstart','touchmove'].forEach(ev=>cv.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener&&document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));

['touchend','pointerup','click','keydown'].forEach(ev=>document.addEventListener&&document.addEventListener(ev,()=>{initAudio();if((scene===Title||scene===Select||scene===Board)&&!Music.name)Music.play('funk');},{passive:true}));
document.addEventListener&&document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running'){try{AC.resume();}catch(e){}}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.focus();initAudio();if(scene===Title)Music.play('funk');const p=toL(e);ptr.x=p.x;ptr.y=p.y;ptr.down=true;G.idle=0;try{cv.setPointerCapture(e.pointerId);}catch(_){}
 if(p.x>=330&&p.y<=22){toggleMute();return;}
 if(G.cut){if(G.cut.t>.5){G.cut=null;if(G.cutQ.length)startCut(G.cutQ.shift());}return;}
 if(G.powerReady&&((scene.care&&p.x<62&&p.y>428)||(scene===Chart&&!Chart.popup&&p.x<74&&p.y>422&&p.y<522))&&usePower())return;
 const blocked=scene.blocking&&scene.blocking();if(!blocked)for(const b of scene.buttons||[])if(!b.hidden&&!b.disabled&&hit(b,p)){pressed=b;return;}
 if(scene.down)scene.down(p);});
cv.addEventListener('pointermove',e=>{const p=toL(e);ptr.x=p.x;ptr.y=p.y;if(ptr.down)G.idle=0;if(scene.move)scene.move(p);});
cv.addEventListener('pointerup',e=>{const p=toL(e);ptr.down=false;if(pressed){const b=pressed;pressed=null;if(hit(b,p)){SFX.blip();b.onTap();}return;}if(scene.up)scene.up(p);});
cv.addEventListener('pointerleave',()=>{if(scene===Select)Select.hover=null;});
cv.addEventListener('pointercancel',()=>{ptr.down=false;pressed=null;if(scene.up)scene.up({x:ptr.x,y:ptr.y});});

function update(dt){gT+=dt;if(G.cut){G.cut.t+=dt;if(G.cut.t>=G.cut.dur){G.cut=null;if(G.cutQ.length)startCut(G.cutQ.shift());}tickFx(dt);return;}scene.t+=dt;for(const k of['freezeT','zenT','boostT','expertT','powerFlash'])if(G[k]>0)G[k]-=dt;if(G.zenT>0)G.stress=0;if(G.freeze>0)G.freeze-=dt;if(G.shake>0)G.shake-=dt;
 if(scene.care)G.stress=Math.max(0,G.stress-6*dt);
 if(scene.clock&&!G.bossTriggered&&!(G.freezeT>0)){G.clock+=dt*RATE*(G.coffeeActive?.5:1);if(G.clock>=1020){G.clock=1020;fx('5:00 PM!',180,260,C.red,14);go(BossIntro);}}
 G.idle+=dt;G.shown+=(G.score-G.shown)*Math.min(1,dt*7);if(Math.abs(G.score-G.shown)<1)G.shown=G.score;
 if(scene.update)scene.update(dt);if(G.zenT>0)G.stress=0;G.stress=clamp(G.stress,0,100);if(G.starPop){G.starPop.t+=dt;if(G.starPop.t>1.4||!scene.care)G.starPop=null;}
 tickFx(dt);}
function tickFx(dt){for(const f of G.fx){f.t+=dt;f.y-=22*dt;}G.fx=G.fx.filter(f=>f.t<f.life);
 for(const p of G.parts){p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}G.parts=G.parts.filter(p=>p.t<p.life&&p.y<H+20);}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,VW,VH);drawSides();ctx.save();ctx.translate(OX,OY);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();if(G.shake>0)ctx.translate(rand(-3,3),rand(-3,3));
 scene.draw();for(const b of scene.buttons||[])drawBtn(b);if(scene.overlay)scene.overlay();
 {const h=!G.cut&&scene.hint?scene.hint():null;if(h){const th=h.now?0:(XP()<10&&G.pi===0?1.2:3.2);if(G.idle>th)drawHint(h,h.now?1:G.idle-th);}}
 if(G.freezeT>0&&(scene.care||scene===Chart||scene===Boss)){ctx.globalAlpha=.12;rect(0,0,W,H,'#9fe3ff');ctx.globalAlpha=1;txtS('❄ FROZEN '+Math.ceil(G.freezeT)+'s',180,scene===Boss?66:120,7,'#bfefff');}
 if(G.powerFlash>0){ctx.globalAlpha=G.powerFlash;rect(0,0,W,H,'#fff6c2');ctx.globalAlpha=1;}
 if(G.starPop){const sp=G.starPop,a=clamp((1.4-sp.t)/.3,0,1);ctx.globalAlpha=a;box(80,226,200,62,'rgba(13,10,26,.85)',C.gold);txt(sp.label,180,240,7,C.white);
  for(let i=0;i<3;i++){const k=clamp((sp.t-.1-i*.15)*6,0,1),on=i<sp.n,sz=on?Math.round(14+10*Math.sin(k*Math.PI)*.4+6*k):16;txtS('★',140+i*40,268,sz,on&&k>0?C.gold:'#2c4570');}ctx.globalAlpha=1;}
 for(const p of G.parts){ctx.globalAlpha=clamp((p.life-p.t)/(p.life*.3),0,1);rect(p.x,p.y,p.s,p.s,p.c);}ctx.globalAlpha=1;
 for(const f of G.fx){ctx.globalAlpha=clamp((f.life-f.t)/.4,0,1);ctx.font=fnt(f.size,PX);const w=ctx.measureText(f.s).width;txtS(f.s,clamp(f.x,w/2+4,W-w/2-4),f.y,f.size,f.col);}ctx.globalAlpha=1;
 if(G.cut)drawCut();
 ctx.restore();ctx.save();ctx.translate(OX,OY);drawMute();ctx.restore();}
let last=performance.now();
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;try{update(dt);draw();}catch(err){console.error(err);}requestAnimationFrame(frame);}
go(Title);requestAnimationFrame(frame);
})();
